<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Odin: Weather App</title>

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300;400;700&display=swap" rel="stylesheet">
	</head>
	<body>
		<div class="app-container">
			<div class="app-header">
				<input id="search-bar" type="text" placeholder="Search for City...">
				<button id="search-button">Search</button>
			</div>
			<div id="app-contents">
				<div class="current-temperature-container">
					<p id="current-city-name">City Name</p>
					<p id="current-temperature">85f</p>
					<div class="current-details-container">
						<p id="current-feels-like">Feels Like: 76f</p>
						<span></span>
						<p id="current-humidity">Humidity: 45h</p>
						<span></span>
						<div class="condition-container">
							<p id="condition-label">Snowy</p>
							<img id="current-condition-img" src="assets/snow.png">
						</div>
					</div>
					<div class="temperature-formats">
						<input type="radio" name="temp-unit" id="unit-fahrenheit" checked>
						<label for="unit-fahrenheit">F</label>
						<input type="radio" name="temp-unit" id="unit-celsius">
						<label for="unit-celsius">C</label>
					</div>
				</div>
				<div id="forecasts-container">
					<div class="forecast-container">
						<p class="forecast-day-text">Mon</p>
						<p class="forecast-temp-text">88f</p>
						<div class="forecast-details-container">
							<p class="forecast-feelslike">74f</p>
							<span></span>
							<p class="forecast-humidity">30</p>
							<span></span>
							<div class=condition-container>
								<p class="forecast-condition-text">Cloudy</p>
								<img class="forecast-condition-img" src="assets/fog.png">
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
